name: Simulator bug
description: Report a reproducible simulator, binding, or RL-interface defect.
title: "[bug] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Diplomacy engine or adjudication
        - Welfare scoring or time horizon
        - Observation, action, reward, or termination
        - Build, packaging, or CI
        - Rendering or documentation
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch, and Python/platform details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include phase, powers, units, centers, orders/actions, seed, and exact command where applicable.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and source
      description: Cite a DATC case, paper section, pinned reference-code location, or explicit interface contract. Say when the source is unknown.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Acceptance criteria and non-goals
      description: State the smallest observable fix and what this issue must not change.
    validations:
      required: true
  - type: checkboxes
    id: risk
    attributes:
      label: Sensitive surfaces
      options:
        - label: This may change game/adjudication rules.
        - label: This may change observations, actions, rewards, termination, or checkpoint compatibility.
        - label: This may change CI, dependencies, permissions, or agent instructions.
