name: Diplomacy CI

on:
  pull_request:
  push:
    branches: [welfare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diplomacy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diplomacy-tests:
    name: diplomacy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/diplomacy-test.txt

      - name: Install focused test dependencies
        run: python -m pip install -r requirements/diplomacy-test.txt

      - name: Build Diplomacy extension
        run: python scripts/build_diplomacy_ext.py build_ext --inplace

      - name: Run Diplomacy regression suite
        run: >-
          python -m pytest
          tests/diplomacy/c_tests
          tests/diplomacy/original/test_datc.py
          tests/test_diplomacy.py
          tests/test_agent_worktree.py
          -q
