name: Diplomacy CI

on:
  pull_request:
  push:
    branches: [welfare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diplomacy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diplomacy-tests:
    name: diplomacy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/diplomacy-test.txt
            requirements/pufferlib4-test.txt

      - name: Install native CPU build tools
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev

      - name: Install focused test dependencies
        run: python -m pip install -r requirements/pufferlib4-test.txt

      - name: Build Diplomacy extension
        run: python scripts/build_diplomacy_ext.py build_ext --inplace

      - name: Build PufferLib 4 CPU environment backend
        run: python scripts/build_diplomacy_puffer4.py

      - name: Run Diplomacy regression suite
        run: >-
          python -m pytest
          tests/diplomacy/c_tests
          tests/diplomacy/original/test_datc.py
          tests/test_diplomacy.py
          tests/test_agent_worktree.py
          -q

  pufferlib4-cpu-training:
    name: pufferlib4-cpu-training
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CPU training dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y clang libomp-dev
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/pufferlib4-train.txt
          python -m pip install -r requirements/pufferlib4-test.txt

      - name: Build PufferLib 4 CPU environment backend
        run: python scripts/build_diplomacy_puffer4.py

      - name: Build the retained adjudication test binding with Torch installed
        run: python scripts/build_diplomacy_ext.py build_ext --inplace

      - name: Check retained rule tests in the PufferLib 4 training environment
        run: >-
          python -m pytest
          tests/diplomacy/c_tests
          tests/diplomacy/original/test_datc.py
          tests/test_diplomacy.py
          tests/test_agent_worktree.py
          -q

      - name: Check rollout boundary handoff
        run: python tests/test_pufferlib4_rollout_boundaries.py

      - name: Check reward magnitudes at the compiled advantage input
        run: python tests/test_pufferlib4_reward_clipping.py

      - name: Check final-action rewards and next-state values
        run: python tests/test_pufferlib4_final_action_bootstrap.py

      - name: Check CPU vector ownership and close behavior
        run: python -m pytest tests/test_pufferlib4_lifecycle.py tests/test_pufferlib4_layout.py tests/test_pufferlib4_importance.py -q

      - name: Check actual PufferLib 4 CPU training and weight reload
        run: python scripts/smoke_pufferlib4_training.py
